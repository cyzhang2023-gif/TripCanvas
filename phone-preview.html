<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routey · 手机预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #e8e4f0 0%, #dde4f0 40%, #e0e8f4 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
    overflow: hidden;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* Phone body */
  .phone {
    position: relative;
    width: 393px;
    height: 852px;
    border-radius: 54px;
    background: #111;
    padding: 12px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.08),
      0 50px 100px -20px rgba(0,0,0,0.35),
      0 30px 60px -15px rgba(0,0,0,0.25),
      0 0 0 11px #1a1a1a,
      0 0 0 12.5px rgba(255,255,255,0.04);
    transform-origin: center center;
  }

  /* Auto-scale */
  @media (max-height: 960px) { .phone { transform: scale(0.9); } }
  @media (max-height: 860px) { .phone { transform: scale(0.8); } }
  @media (max-height: 760px) { .phone { transform: scale(0.7); } }
  @media (max-height: 660px) { .phone { transform: scale(0.6); } }

  /* Dynamic Island */
  .notch {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 12px;
  }
  .notch-cam {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #1e1e2e 0%, #0a0a0a 100%);
    box-shadow: inset 0 0 3px rgba(60,60,100,0.5), 0 0 2px rgba(0,0,0,0.8);
  }

  /* Screen */
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: #fff;
    position: relative;
  }
  .screen iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Home indicator */
  .home-bar {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 5px;
    border-radius: 3px;
    background: rgba(0,0,0,0.2);
    z-index: 10;
  }

  /* Side buttons */
  .phone::before,
  .phone::after {
    content: "";
    position: absolute;
    background: #1e1e1e;
    border-radius: 2px;
  }
  /* Power (right) */
  .phone::before {
    right: -3px;
    top: 185px;
    width: 3px;
    height: 78px;
    box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.05);
  }
  /* Volume (left) */
  .phone::after {
    left: -3px;
    top: 165px;
    width: 3px;
    height: 40px;
    box-shadow:
      inset 0 0 0 0.5px rgba(255,255,255,0.05),
      0 54px 0 0 #1e1e1e;
  }
  /* Silent switch */
  .silent-switch {
    position: absolute;
    left: -3px;
    top: 125px;
    width: 3px;
    height: 22px;
    background: #1e1e1e;
    border-radius: 2px;
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toolbar input {
    width: 320px;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1.5px solid #d0d0d8;
    font-size: 13px;
    outline: none;
    background: white;
    color: #333;
    transition: border-color 0.2s;
  }
  .toolbar input:focus {
    border-color: #7c6cf0;
  }
  .toolbar button {
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #7c6cf0, #5b45f3);
    color: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .toolbar button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(91,69,243,0.3);
  }
  .toolbar button:active {
    transform: scale(0.97);
  }

  .hint {
    font-size: 11px;
    color: #888;
    text-align: center;
  }
</style>
</head>
<body>

<div class="container">
  <div class="toolbar">
    <input id="urlInput" type="text" value="http://routey.top" placeholder="输入网址..." />
    <button onclick="loadUrl()">打开</button>
  </div>

  <div class="phone">
    <div class="notch">
      <div class="notch-cam"></div>
    </div>
    <div class="silent-switch"></div>
    <div class="screen">
      <iframe id="preview" src="http://routey.top" allow="clipboard-read; clipboard-write"></iframe>
    </div>
    <div class="home-bar"></div>
  </div>

  <p class="hint">iPhone 15 Pro · 393 x 852 · 可在上方输入其他网址预览</p>
</div>

<script>
function loadUrl() {
  const input = document.getElementById('urlInput');
  let url = input.value.trim();
  if (url && !/^https?:\/\//i.test(url)) url = 'http://' + url;
  document.getElementById('preview').src = url;
}
document.getElementById('urlInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') loadUrl();
});
</script>
</body>
</html>
